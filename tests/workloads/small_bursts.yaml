# Smaller bursts (2-3 readings) with alarms and a couple of mild problems.
id: small_bursts
seed: 21
time_unit: claimed
duration_s: 7200
drain_s: 900
flows:
  - {pattern: burst, src: "sender[0-1]", dst: receiver0, direction: uplink, start_s: 60, gap_min_s: 240, gap_max_s: 480, msgs_per_burst: 3, msg_bytes: 32, duration_s: 7000, deadline_s: 300}
  - {pattern: burst, src: "sender[2-3]", dst: receiver0, direction: uplink, start_s: 30, gap_min_s: 180, gap_max_s: 360, msgs_per_burst: 2, msg_bytes: 32, duration_s: 7000, deadline_s: 300}
  - {pattern: poisson, src: "sender*", dst: receiver0, direction: alarm, mean_interval_s: 1800, duration_s: 7000, msg_bytes: 8, deadline_s: 30}
events:
  - {t_s: 2400, kind: loss_burst, target: "sender*-radio", loss_pct: 15, duration_s: 600}
  - {t_s: 4800, kind: blackout, target: "sender3-radio", duration_s: 400}
