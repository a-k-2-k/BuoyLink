# Long and repeated blackouts on top of basic traffic: tests how fast we recover.
id: blackouts
seed: 41
time_unit: claimed
duration_s: 10800
drain_s: 900
flows:
  - {pattern: burst, src: "sender*", dst: receiver0, direction: uplink, start_s: 60, gap_min_s: 300, gap_max_s: 600, msgs_per_burst: 4, msg_bytes: 32, duration_s: 10600, deadline_s: 300}
  - {pattern: poisson, src: "sender*", dst: receiver0, direction: alarm, mean_interval_s: 1800, duration_s: 10600, msg_bytes: 8, deadline_s: 30}
events:
  - {t_s: 1200, kind: blackout, target: "sender0-radio", duration_s: 900}
  - {t_s: 3000, kind: blackout, target: "radio-receiver0", duration_s: 600}
  - {t_s: 5400, kind: blackout, target: "sender[1-2]-radio", duration_s: 1200}
  - {t_s: 8400, kind: blackout, target: "sender3-radio", duration_s: 300}
  - {t_s: 9000, kind: blackout, target: "radio-receiver0", duration_s: 300}
