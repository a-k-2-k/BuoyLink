# Six hours of basic-style traffic with alarms and occasional mild trouble.
id: long_mild
seed: 31
time_unit: claimed
duration_s: 21600
drain_s: 900
flows:
  - {pattern: burst, src: "sender*", dst: receiver0, direction: uplink, start_s: 60, gap_min_s: 300, gap_max_s: 600, msgs_per_burst: 4, msg_bytes: 32, duration_s: 21400, deadline_s: 300}
  - {pattern: poisson, src: "sender*", dst: receiver0, direction: alarm, mean_interval_s: 2400, duration_s: 21400, msg_bytes: 8, deadline_s: 30}
events:
  - {t_s: 3600, kind: loss_burst, target: "sender1-radio", loss_pct: 20, duration_s: 1200}
  - {t_s: 9000, kind: blackout, target: "sender2-radio", duration_s: 480}
  - {t_s: 14400, kind: blackout, target: "radio-receiver0", duration_s: 240}
  - {t_s: 18000, kind: loss_burst, target: "sender*-radio", loss_pct: 10, duration_s: 1800}
