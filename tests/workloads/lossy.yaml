# Basic traffic, but every buoy link drops 15% the whole time, plus alarms.
id: lossy
seed: 11
time_unit: claimed
duration_s: 7200
drain_s: 900
flows:
  - pattern: burst
    src: "sender*"
    dst: receiver0
    direction: uplink
    start_s: 60
    gap_min_s: 300
    gap_max_s: 600
    msgs_per_burst: 4
    msg_bytes: 32
    duration_s: 7000
    deadline_s: 300
  - pattern: poisson
    src: "sender*"
    dst: receiver0
    direction: alarm
    mean_interval_s: 1800
    duration_s: 7000
    msg_bytes: 8
    deadline_s: 30
events:
  - {t_s: 0, kind: loss_burst, target: "sender*-radio", loss_pct: 15}
