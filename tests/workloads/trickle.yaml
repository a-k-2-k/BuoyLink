# Single readings trickling in at random, plus alarms. Batching has less to
# work with here.
id: trickle
seed: 3
time_unit: claimed
duration_s: 7200
drain_s: 900
flows:
  - pattern: poisson
    src: "sender*"
    dst: receiver0
    direction: uplink
    mean_interval_s: 60
    duration_s: 7000
    msg_bytes: 32
    deadline_s: 300
  - pattern: poisson
    src: "sender*"
    dst: receiver0
    direction: alarm
    mean_interval_s: 1800
    duration_s: 7000
    msg_bytes: 8
    deadline_s: 30
events: []
